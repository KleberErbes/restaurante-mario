<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cardápio — Restaurante do Mário</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --preto:#141210; --papel:#faf6ee; --carta:#fffdf8;
  --linha:#e0d8c8; --tinta:#4a4237;
  --verde:#1f7a4c; --amarelo:#c98a00; --vermelho:#b3261e;
  --azul:#1a5490; --destaque:#d94f04;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
  background:var(--papel);color:var(--preto);font-size:15px;line-height:1.5}
button{font-family:inherit;font-size:14px;cursor:pointer;border:none;border-radius:6px;padding:9px 16px}
button:active{transform:translateY(1px)}
button:disabled{opacity:.5;cursor:not-allowed}
.btn{background:var(--preto);color:#fff}
.btn:hover{background:#2c2823}
.btn-2{background:#fff;color:var(--preto);border:1.5px solid var(--linha)}
.btn-2:hover{border-color:var(--preto)}
.btn-mini{font-size:12px;padding:4px 9px}
input,select{font-family:inherit;font-size:15px;width:100%;padding:9px 11px;
  border:1.5px solid var(--linha);border-radius:6px;background:#fff;color:var(--preto)}
input:focus,select:focus{outline:none;border-color:var(--preto)}
.campo{margin-bottom:13px}
.campo label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.05em;
  color:var(--tinta);font-weight:700;margin-bottom:5px}

header{background:var(--preto);color:#fff;padding:14px 22px;display:flex;
  align-items:center;gap:16px;position:sticky;top:0;z-index:50}
header h1{font-size:18px;font-weight:800;letter-spacing:-.02em}
header .logo{height:34px;width:34px;object-fit:cover;border-radius:7px;flex:none}
header .dir{margin-left:auto;display:flex;gap:8px}

main{max-width:1240px;margin:0 auto;padding:24px 22px 80px}
.cartao{background:var(--carta);border:1.5px solid var(--linha);border-radius:10px;
  padding:20px;margin-bottom:18px}
.cartao h2{font-size:16px;margin-bottom:6px;display:flex;align-items:center;gap:10px}
.cartao .ajuda{font-size:13px;color:var(--tinta);margin-bottom:16px}

.colunas{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.colunas > *{min-width:0}
@media(max-width:1080px){.colunas{grid-template-columns:repeat(2,1fr)}}
@media(max-width:600px){.colunas{grid-template-columns:1fr}}

.cat h3{font-size:12px;text-transform:uppercase;letter-spacing:.05em;
  color:var(--tinta);font-weight:700;margin-bottom:10px;
  display:flex;align-items:center;justify-content:space-between;gap:8px}
.cat h3 .conta{background:var(--linha);color:var(--tinta);
  border-radius:20px;padding:1px 8px;font-size:11px;flex:none}

.lista{min-height:8px}

.modal{position:fixed;inset:0;background:rgba(20,18,16,.45);z-index:150;
  display:flex;align-items:center;justify-content:center;padding:18px}
.modal .janela{background:var(--carta);border-radius:12px;width:100%;
  max-width:520px;padding:24px;max-height:88vh;overflow:auto}
.modal .janela.chacoalha{animation:chacoalha .3s}
@keyframes chacoalha{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.modal h3{font-size:17px;margin-bottom:4px}
.rodape{display:flex;gap:9px;justify-content:flex-end;margin-top:18px}

/* Abas: planejar a semana e montar o dia moram no mesmo lugar */
.abas{display:flex;gap:6px;margin-bottom:18px;border-bottom:1.5px solid var(--linha)}
.abas button{background:transparent;color:var(--tinta);border-radius:0;padding:11px 18px;
  font-weight:600;border-bottom:3px solid transparent;margin-bottom:-1.5px}
.abas button.on{color:var(--preto);border-bottom-color:var(--preto)}
.abas button:hover{color:var(--preto)}

/* Semana: ver os seis dias juntos é o ponto — sem isso ele não percebe
   que colocou bisteca na segunda e na quinta. */
.semana{display:grid;grid-template-columns:repeat(6,1fr);gap:11px}
.semana > *{min-width:0}
@media(max-width:1150px){.semana{grid-template-columns:repeat(3,1fr)}}
@media(max-width:760px){.semana{grid-template-columns:repeat(2,1fr)}}
@media(max-width:520px){.semana{grid-template-columns:1fr}}

.pdia{background:#fff;border:1.5px solid var(--linha);border-radius:10px;padding:12px 11px}
.pdia.hoje{border-color:var(--preto);box-shadow:0 0 0 3px rgba(20,18,16,.07)}
.pdia h4{font-size:13px;display:flex;align-items:baseline;gap:6px;margin-bottom:2px}
.pdia h4 .num{font-size:11px;color:var(--tinta);font-weight:600}
.pdia .acoes{display:flex;gap:5px;margin:9px 0 11px}
.pdia .acoes button{font-size:11px;padding:4px 8px;flex:1}

.grupo{margin-bottom:11px}
.grupo .rot{font-size:10px;text-transform:uppercase;letter-spacing:.05em;
  color:var(--tinta);font-weight:700;margin-bottom:5px;display:flex;
  align-items:center;justify-content:space-between}
.grupo .rot button{background:transparent;color:var(--tinta);font-size:15px;
  line-height:1;padding:0 4px}
.grupo .rot button:hover{color:var(--preto)}
.pill{display:flex;align-items:center;gap:5px;font-size:12.5px;padding:4px 7px;
  border-radius:5px;margin-bottom:4px;line-height:1.35}
.pill span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill button{background:transparent;padding:0 3px;font-size:14px;line-height:1;opacity:.5}
.pill button:hover{opacity:1}
.pill.a{background:#f0f6f2;color:#1a6b42}
.pill.c{background:#fbeeea;color:#b84a1c}
.pill.s{background:#f2f6fa;color:#17497f}
.pill.d{background:#fdf6e5;color:#8a6400}
.pill.rep{box-shadow:inset 0 0 0 1.5px var(--vermelho)}
.vaziog{font-size:12px;color:#b9b0a0;font-style:italic}

/* Contadores: com muitos itens, saber quantos entraram em cada
   categoria evita a segunda-feira com 9 carnes e a quinta com 1 */
.grupo .rot .etq{display:flex;align-items:center;gap:6px;min-width:0}
.cont{font-size:10px;font-weight:700;padding:1px 6px;border-radius:20px;
  line-height:1.5;flex:none;letter-spacing:0}
.cont.a{background:#dbeae1;color:#1a6b42}
.cont.c{background:#f6d9cf;color:#b84a1c}
.cont.s{background:#d8e5f0;color:#17497f}
.cont.d{background:#f4e6c4;color:#8a6400}
.totdia{margin-left:auto;font-size:10.5px;font-weight:700;background:var(--preto);
  color:#fff;border-radius:20px;padding:1px 7px;line-height:1.6;flex:none}

.navsem{display:flex;gap:8px;align-items:center;margin-bottom:16px;
  padding-bottom:14px;border-bottom:1.5px solid var(--linha)}
.navsem .seta{flex:none;font-size:16px;padding:8px 14px;line-height:1}
.navsem .periodo{font-size:14.5px;flex:1;text-align:center;white-space:nowrap}
.navsem .atual{flex:none}
.navsem .fixsem{flex:none;font-size:13px;padding:8px 14px}
.menufix{position:relative;flex:none}
.dropfix{display:none;position:absolute;right:0;top:calc(100% + 5px);z-index:60;
  background:var(--carta);border:1.5px solid var(--linha);border-radius:9px;
  padding:5px;min-width:210px;box-shadow:0 8px 22px rgba(20,18,16,.16)}
.dropfix.on{display:block}
.dropfix button{display:block;width:100%;text-align:left;background:transparent;
  color:var(--preto);font-size:13.5px;padding:9px 11px;border-radius:6px}
.dropfix button:hover{background:#f2ecdd}
.dropfix hr{border:none;border-top:1.5px solid var(--linha);margin:4px 6px}

/* ===== CELULAR =====
   Ele planeja no celular, então os seis dias empilham. O valor de ver a
   semana inteira se mantém pelos avisos de repetição, que continuam
   marcando o prato em vermelho onde quer que ele esteja. */
@media(max-width:600px){
  .abas button{padding:11px 13px;font-size:14px;flex:1}
  .navsem{gap:6px;flex-wrap:wrap}
  .navsem .seta{padding:9px 15px}
  .navsem .periodo{font-size:14px;order:-1;width:100%;flex:none;margin-bottom:4px}
  .navsem .atual{margin-left:auto}

  .semana{gap:12px}
  .pdia{padding:14px 13px}
  .pdia h4{font-size:15px;margin-bottom:4px}
  .pdia h4 .num{font-size:12.5px}
  .pdia .acoes button{font-size:12.5px;padding:8px 10px}

  .grupo{margin-bottom:13px}
  .grupo .rot{font-size:11px;margin-bottom:7px}
  .cont{font-size:11px;padding:2px 7px}
  .totdia{font-size:12px;padding:2px 9px}
  .grupo .rot button{font-size:22px;padding:2px 10px}
  .item .fix{font-size:19px;padding:3px 6px}
  .menufix{width:100%;order:9;margin-top:2px}
  .navsem .fixsem{width:100%}
  .dropfix{left:0;right:0;min-width:0}
  .dropfix button{font-size:15px;padding:12px 13px}
  .pill{font-size:14px;padding:8px 10px;margin-bottom:6px}
  .pill button{font-size:19px;padding:0 6px;opacity:.7}

  .modal .janela{padding:18px 15px;max-height:92vh}
  .escolha{max-height:62vh}
  .opt{padding:13px 12px;margin-bottom:7px}
  .opt .n{font-size:15px}
  .opt .dias{font-size:12px}
  .opt .marca{width:23px;height:23px}
  .contsel{font-size:13.5px}
}

.repaviso{background:#fbe6e5;color:var(--vermelho);border-radius:7px;
  padding:10px 13px;font-size:13px;margin-bottom:14px}

/* Escolher item: ordenado por quem está há mais tempo sem sair */
.escolha{max-height:60vh;overflow:auto;margin:4px -4px 0;padding:0 4px}
.opt{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:7px;
  border:1.5px solid var(--linha);background:#fff;margin-bottom:5px;cursor:pointer}
.opt:hover{border-color:var(--preto)}
.opt.ja{opacity:.45}
.opt.sel{border-color:var(--verde);background:#f0f6f2}
.opt .marca{flex:none;width:19px;height:19px;border-radius:5px;border:1.5px solid var(--linha);
  background:#fff;display:flex;align-items:center;justify-content:center;
  font-size:12px;color:#fff;line-height:1}
.opt.sel .marca{background:var(--verde);border-color:var(--verde)}
.opt.sel .marca::after{content:'✓'}
.opt.ja .marca{background:#ccc;border-color:#ccc;color:#fff}
.contsel{margin-right:auto;font-size:13px;color:var(--tinta);align-self:center}
.secfix{margin-bottom:14px}
.rotfix{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;
  color:var(--tinta);font-weight:700;margin-bottom:6px}
.opt .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.opt .dias{font-size:11.5px;font-weight:700;flex:none;padding:2px 8px;border-radius:20px}
.dias.novo{background:#e3f2e9;color:var(--verde)}
.dias.longe{background:#eef2f6;color:var(--tinta)}
.dias.perto{background:#fdf2dd;color:#8a6400}
.dias.recente{background:#fbe6e5;color:var(--vermelho)}

/* Barra de filtros: com muitos itens, achar um vira o gargalo */
.filtros{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:16px;
  padding-bottom:15px;border-bottom:1.5px solid var(--linha)}
.caixabusca{position:relative;flex:1;min-width:170px;max-width:320px;display:flex}
.caixabusca input{flex:1;padding-right:34px}
.caixabusca .limpar{position:absolute;right:4px;top:50%;transform:translateY(-50%);
  background:transparent;color:#a89e8c;font-size:19px;line-height:1;padding:3px 7px}
.caixabusca .limpar:hover{color:var(--preto)}
.chkbox{display:flex;align-items:center;gap:7px;cursor:pointer;font-size:14px;
  user-select:none;padding:8px 12px;border-radius:7px;border:1.5px solid var(--linha);
  background:#fff}
.chkbox:hover{border-color:var(--preto)}
.chkbox.on{background:#eef5f0;border-color:var(--verde);color:var(--verde);font-weight:600}
.chkbox.estrela input{accent-color:var(--amarelo)}
.chkbox.estrela.on{background:#fdf6e5;border-color:var(--amarelo);color:#8a6400}
.chkbox input{width:auto;flex:none;margin:0;accent-color:var(--verde)}
.filtros .resumo{font-size:12.5px;color:var(--tinta);margin-left:auto}
.semresultado{font-size:13px;color:#a89e8c;padding:10px 4px;font-style:italic}

.item{display:flex;align-items:center;gap:7px;padding:7px 8px;border-radius:7px;
  border:1.5px solid var(--linha);background:#fff;margin-bottom:6px;
  cursor:grab;user-select:none}
body.filtrado .item,body.filtrado .pega{cursor:default}
body.filtrado .pega{opacity:.3}
.item.off{opacity:.5;background:#f4f0e6}
.item .nome{flex:1;min-width:0;font-size:14px;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap;cursor:text;padding:2px 3px;border-radius:4px}
.item .nome:hover{background:#f2ecdd}
.item input.edita{flex:1;min-width:0;font-size:14px;padding:3px 6px}
.item .fix{background:transparent;color:#cec5b4;padding:2px 4px;font-size:15px;
  line-height:1;flex:none}
.item .fix:hover{color:var(--amarelo)}
.item .fix.on{color:var(--amarelo)}
.item .x{background:transparent;color:#b9b0a0;padding:2px 5px;font-size:17px;line-height:1;flex:none}
.item .x:hover{color:var(--vermelho)}

/* Pega para arrastar. touch-action:none impede a página de rolar
   quando o dedo puxa o item no celular. */
.pega{flex:none;width:16px;color:#c3baa9;font-size:14px;line-height:1;
  text-align:center;cursor:grab;touch-action:none}
.pega:hover{color:var(--tinta)}
.item.fantasma{opacity:.28;border-style:dashed}
.item.voando{position:fixed;z-index:500;pointer-events:none;cursor:grabbing;
  box-shadow:0 10px 26px rgba(20,18,16,.24);margin:0;background:#fff;opacity:1}
body.arrastando,body.arrastando *{cursor:grabbing !important}

/* Interruptor de disponibilidade — a ação do dia a dia */
.chave{position:relative;width:40px;height:23px;flex:none;border-radius:20px;
  background:#cfc6b4;transition:.15s;padding:0}
.chave::after{content:'';position:absolute;top:3px;left:3px;width:17px;height:17px;
  border-radius:50%;background:#fff;transition:.15s}
.chave.on{background:var(--verde)}
.chave.on::after{transform:translateX(17px)}

.novo{display:flex;gap:6px;margin-top:10px}
.novo input{font-size:14px;padding:8px 10px}

/* As três primeiras carnes viram a descrição da marmita padrão */
.marca3{border-left:3px solid var(--destaque)}
.aviso3{font-size:11.5px;color:var(--destaque);margin-top:8px;line-height:1.4}

/* Preview: espelha o que o site renderiza */
.preview{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
@media(max-width:1000px){.preview{grid-template-columns:repeat(2,1fr)}}
@media(max-width:620px){.preview{grid-template-columns:1fr}}
.pbox{background:#fff;border:1.5px solid var(--linha);border-radius:9px;padding:13px}
.pbox h4{font-size:11px;text-transform:uppercase;letter-spacing:.05em;
  color:var(--tinta);margin-bottom:9px}
.tag{display:inline-block;font-size:12.5px;padding:3px 9px;border-radius:20px;
  margin:0 4px 5px 0;border:1.5px solid}
.tag.a{background:#f0f6f2;border-color:#bfdccb;color:var(--verde)}
.tag.c{background:#fbeeea;border-color:#f0cbbd;color:var(--destaque)}
.tag.s{background:#f2f6fa;border-color:#c6d8e8;color:var(--azul)}
.tag.d{background:#fdf6e5;border-color:#ecd9a8;color:var(--amarelo)}
.pvazio{color:#aaa;font-size:13px}

/* Bloco do texto para o WhatsApp */
#txtWhats{width:100%;min-height:430px;font-family:ui-monospace,"SF Mono",Menlo,monospace;
  font-size:13.5px;line-height:1.55;padding:14px;border:1.5px solid var(--linha);
  border-radius:8px;background:#fff;color:var(--preto);resize:vertical;white-space:pre}
#txtWhats:focus{outline:none;border-color:var(--preto)}
.zapbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center}
.zapbar .esq{margin-right:auto;font-size:12.5px;color:var(--tinta)}
.btn-zap{background:#1f7a4c;color:#fff;text-decoration:none;display:inline-flex;
  align-items:center;padding:9px 16px;border-radius:6px;font-size:14px;font-weight:600}
.btn-zap:hover{background:#19643e}

.aviso{padding:11px 14px;border-radius:6px;font-size:13.5px;margin-bottom:14px}
.aviso.erro{background:#fbe6e5;color:var(--vermelho)}
.aviso.ok{background:#e3f2e9;color:var(--verde)}
.aviso.info{background:#e8eef5;color:var(--azul)}

.fechados{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}
.dia{display:flex;align-items:center;gap:7px;background:#fbe6e5;color:var(--vermelho);
  border-radius:6px;padding:5px 10px;font-size:13.5px;font-weight:600}
.dia button{background:transparent;color:var(--vermelho);padding:0 3px;font-size:15px;line-height:1}

#login{position:fixed;inset:0;background:var(--papel);display:flex;
  align-items:center;justify-content:center;z-index:200;padding:20px}
#login .box{background:var(--carta);border:1.5px solid var(--linha);border-radius:12px;
  padding:32px;width:100%;max-width:380px}
#login h1{font-size:24px;margin-bottom:4px}
#login p{color:var(--tinta);font-size:14px;margin-bottom:22px}
#login .logo{height:64px;width:64px;object-fit:cover;border-radius:12px;
  margin:0 auto 14px;display:block}

/* ============ CELULAR ============
   O dono usa isso em pé no balcão: alvo de toque maior, menos moldura,
   e a pega do arrasto mais larga para o dedo pegar de primeira. */
@media(max-width:600px){
  body{font-size:16px}
  header{padding:11px 14px;gap:11px}
  header h1{font-size:16px}
  header .logo{height:30px;width:30px}
  header .dir{gap:6px}
  header .dir button{padding:8px 11px;font-size:13px}

  main{padding:16px 13px 70px}
  .cartao{padding:15px 13px;border-radius:9px;margin-bottom:14px}
  .cartao h2{font-size:15px}
  .cartao .ajuda{font-size:13px;margin-bottom:14px}

  .colunas{gap:22px}
  .cat h3{font-size:12.5px;margin-bottom:8px}

  .item{padding:10px 9px;gap:9px;margin-bottom:7px}
  .item .nome{font-size:15px;padding:3px}
  .item .x{font-size:22px;padding:3px 8px}
  .pega{width:24px;font-size:17px}

  /* Interruptor maior: é a ação mais usada e a mais fácil de errar */
  .chave{width:50px;height:29px}
  .chave::after{width:23px;height:23px}
  .chave.on::after{transform:translateX(21px)}

  .novo input{font-size:16px;padding:11px 12px}
  .novo button{padding:11px 18px}

  .preview{gap:11px}
  .pbox{padding:12px}
  .tag{font-size:13px;padding:4px 10px}

  .fechados{gap:8px}
  .dia{padding:8px 12px;font-size:14px}
  .dia button{font-size:19px;padding:0 4px}

  #login .box{padding:24px 20px}
  #toast{left:13px;right:13px;transform:none;text-align:center;bottom:16px}
}

/* Telas estreitas de verdade: a data e o botão param de brigar */
@media(max-width:380px){
  header h1{font-size:15px}
  header .dir button{padding:7px 9px;font-size:12px}
}

#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);
  background:var(--preto);color:#fff;padding:12px 22px;border-radius:8px;
  font-size:14px;z-index:300;opacity:0;pointer-events:none;transition:.2s}
#toast.show{opacity:1}
.carregando{text-align:center;padding:50px;color:var(--tinta)}
</style>
</head>
<body>

<div id="login">
  <div class="box">
    <img src="logo.jpeg" alt="Restaurante do Mário" class="logo">
    <h1>Cardápio</h1>
    <p>Restaurante do Mário</p>
    <div class="campo">
      <label>Email</label>
      <input type="email" id="email" autocomplete="username"
             onkeydown="if(event.key==='Enter'){event.preventDefault();$('senha').focus()}">
    </div>
    <div class="campo">
      <label>Senha</label>
      <input type="password" id="senha" autocomplete="current-password"
             onkeydown="if(event.key==='Enter'){event.preventDefault();entrar()}">
    </div>
    <div id="loginErro"></div>
    <button class="btn" style="width:100%" onclick="entrar()">Entrar</button>
  </div>
</div>

<header>
  <img src="logo.jpeg" alt="" class="logo">
  <h1>Cardápio</h1>
  <div class="dir">
    <button class="btn-2" onclick="carregar()">Recarregar</button>
    <button class="btn-2" onclick="sair()">Sair</button>
  </div>
</header>

<main id="app"><div class="carregando">Carregando…</div></main>
<div id="toast"></div>

<script>
/* ===================================================================
   CONFIGURAÇÃO — cole a mesma anon key do crediário
   =================================================================== */
const SUPABASE_URL      = 'https://kjbwnesvygisuwvoveli.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_XmVYyFWVyaG3zilJg6Otpg_YNYTWAGG';

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const $ = id => document.getElementById(id);
const esc = s => String(s??'').replace(/[&<>"']/g, m =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const hoje = () => new Date().toLocaleDateString('en-CA',{timeZone:'America/Sao_Paulo'});
const dbr = d => { const p=String(d).split('-'); return p.length===3?`${p[2]}/${p[1]}/${p[0]}`:d; };

const CATS = [
  { key:'acompanhamentos', rot:'Acompanhamentos', tag:'a' },
  { key:'carnes',          rot:'Carnes',          tag:'c' },
  { key:'saladas',         rot:'Saladas',         tag:'s' },
  { key:'sobremesas',      rot:'Sobremesas',      tag:'d' },
];

let ITENS = [];
let FECHADOS = [];
let OCUPADO = false;
let BUSCA = '';
let ABA = 'hoje';
let PLANO = {};          // 'YYYY-MM-DD' -> [itens]
let HIST = {};           // categoria -> [{id,nome,dias,...}]
let SEG = null;          // segunda da semana mostrada
let SO_ATIVOS = false;
let SO_FIXOS = false;

/* Tira acento e caixa para a busca achar "polenta" digitando "polenta"
   ou "Polênta" — no balcão ninguém acentua direito com pressa. */
const chave = t => String(t||'').toLowerCase()
  .normalize('NFD').replace(/[\u0300-\u036f]/g,'');

function filtrada(k){
  let l = daCat(k);
  if(SO_ATIVOS) l = l.filter(i => i.ativo);
  if(SO_FIXOS)  l = l.filter(i => i.fixo);
  if(BUSCA.trim()){
    const b = chave(BUSCA.trim());
    l = l.filter(i => chave(i.nome).includes(b));
  }
  return l;
}

const filtroLigado = () => SO_ATIVOS || SO_FIXOS || BUSCA.trim().length > 0;

function alternarSoAtivos(v){ SO_ATIVOS = v; render(); }
function alternarSoFixos(v){ SO_FIXOS = v; render(); }

/* Editar os fixos sem sair do planejamento. Antes isso jogava o dono
   na aba do cardápio de hoje — e ali a estrela fica ao lado do
   interruptor do dia, o que faz parecer que uma coisa mexe na outra. */
function editarFixos(){
  abrirModal(`
    <h3>Itens de todo dia</h3>
    <div class="ajuda" style="margin-bottom:6px">Entram na semana pelo "Preencher a semana". Não ligam nem desligam nada no cardápio de hoje.</div>
    <input id="bFix" placeholder="Buscar…" autocomplete="off"
           oninput="filtrarFix(this.value)" style="margin:10px 0">
    <div class="escolha" id="listaFix">${listaFixHTML()}</div>
    <div class="rodape">
      <span class="contsel" id="contFix"></span>
      <button class="btn" onclick="fecharModal()">Pronto</button>
    </div>
  `);
  atualizarContFix();
  setTimeout(()=>$('bFix')?.focus(), 60);
}

function listaFixHTML(){
  return CATS.map(c => {
    const its = daCat(c.key);
    if(!its.length) return '';
    return `<div class="secfix">
      <div class="rotfix">${c.rot}</div>
      ${its.map(i => `<div class="opt ${i.fixo?'sel':''}" data-nome="${esc(chave(i.nome))}"
             data-id="${i.id}" onclick="marcarFixo(this,'${i.id}')">
        <span class="marca"></span>
        <span class="n">${esc(i.nome)}</span>
      </div>`).join('')}
    </div>`;
  }).join('');
}

function atualizarContFix(){
  const n = ITENS.filter(i => i.fixo).length;
  const el = $('contFix');
  if(el) el.textContent = n === 0 ? 'Nenhum item de todo dia'
                        : n === 1 ? '1 item de todo dia' : `${n} itens de todo dia`;
}

function filtrarFix(v){
  const b = chave(v.trim());
  $('listaFix').querySelectorAll('.opt').forEach(el => {
    el.style.display = !b || el.dataset.nome.includes(b) ? '' : 'none';
  });
  // Categoria sem nenhum resultado some junto com o rótulo
  $('listaFix').querySelectorAll('.secfix').forEach(sec => {
    const algum = [...sec.querySelectorAll('.opt')].some(o => o.style.display !== 'none');
    sec.style.display = algum ? '' : 'none';
  });
}

async function marcarFixo(el, id){
  const it = ITENS.find(i => i.id === id);
  const novo = !it.fixo;
  it.fixo = novo;
  el.classList.toggle('sel', novo);
  atualizarContFix();

  const { error } = await sb.from('cardapio_itens').update({ fixo: novo }).eq('id', id);
  if(error){
    it.fixo = !novo;
    el.classList.toggle('sel', !novo);
    atualizarContFix();
    toast(erroDe(error), true);
    return;
  }
  // O selo "todo dia" na lista de escolha vem daqui
  if(HIST){
    Object.values(HIST).forEach(arr => {
      const h = arr.find(x => x.id === id);
      if(h) h.fixo = novo;
    });
  }
}

/* Item fixo: entra todo dia no planejamento e fica fora do alerta de
   repetição. Não tem efeito nenhum sobre o cardápio do dia. */
async function alternarFixo(id){
  const it = ITENS.find(i => i.id === id);
  const novo = !it.fixo;
  it.fixo = novo; render();
  const { error } = await sb.from('cardapio_itens').update({ fixo: novo }).eq('id', id);
  if(error){ it.fixo = !novo; render(); toast(erroDe(error), true); return; }
  toast(novo ? 'Marcado como item de todo dia.' : 'Não é mais item de todo dia.');
}

function limparBusca(){
  BUSCA = '';
  clearTimeout(tempoBusca);
  render();
  $('busca')?.focus();
}

let tempoBusca = null;
function filtrarBusca(v){
  BUSCA = v;
  clearTimeout(tempoBusca);
  tempoBusca = setTimeout(() => {
    const pos = document.activeElement === $('busca') ? $('busca').selectionStart : null;
    render();
    if(pos !== null){ const b = $('busca'); b.focus(); b.setSelectionRange(pos, pos); }
  }, 140);
}

function toast(msg, erro){
  const t = $('toast');
  t.textContent = msg;
  t.style.background = erro ? 'var(--vermelho)' : 'var(--preto)';
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2600);
}

function erroDe(e){
  const m = String(e?.message || e || '');
  if(m.includes('uq_cardapio_item')) return 'Esse item já existe nessa categoria.';
  if(m.includes('JWT') || m.includes('PGRST301')) return 'Sessão expirada. Entre novamente.';
  if(m.includes('Failed to fetch')) return 'Sem conexão com o servidor.';
  return m || 'Erro inesperado.';
}

/* ================= LOGIN ================= */
async function entrar(){
  const email = $('email').value.trim(), senha = $('senha').value;
  if(!email || !senha) return;
  $('loginErro').innerHTML = '<div class="aviso info">Conectando…</div>';
  const r = await sb.auth.signInWithPassword({ email, password: senha });
  if(r.error){
    const m = r.error.message || '';
    let txt = 'Email ou senha incorretos.';
    if(m.includes('Email not confirmed')) txt = 'Usuário não confirmado no Supabase.';
    else if(m.includes('API key')) txt = 'Anon key não preenchida neste arquivo.';
    else if(!m.includes('Invalid login')) txt = 'Falha no login: ' + m;
    $('loginErro').innerHTML = `<div class="aviso erro">${esc(txt)}</div>`;
    return;
  }
  $('login').style.display = 'none';
  carregar();
}

async function sair(){ await sb.auth.signOut(); location.reload(); }

/* ================= DADOS ================= */
async function carregar(){
  try{
    const [a, b] = await Promise.all([
      sb.from('cardapio_itens').select('*').order('categoria').order('ordem').order('nome'),
      sb.from('dias_fechados').select('*').gte('data', hoje()).order('data')
    ]);
    if(a.error) throw a.error;
    if(b.error) throw b.error;
    ITENS = a.data; FECHADOS = b.data;
    if(!SEG) SEG = segundaDe(hoje());
    if(ABA === 'semana') await carregarPlano();
    render();
  }catch(e){
    $('app').innerHTML = `<div class="aviso erro">${esc(erroDe(e))}</div>`;
  }
}

const daCat = k => ITENS.filter(i => i.categoria === k);
const ativos = k => daCat(k).filter(i => i.ativo);

/* ===================================================================
   PLANEJAMENTO DA SEMANA
   Só orientação: não liga nem desliga nada no cardápio do dia. O dono
   projeta aqui e, no dia, monta o cardápio na aba "Hoje".
   =================================================================== */
const NOMES_DIA = ['Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];

function segundaDe(iso){
  const d = new Date(iso + 'T12:00:00');
  const dow = d.getDay();                       // 0=dom
  const recuo = dow === 0 ? 6 : dow - 1;        // domingo cai na semana anterior
  d.setDate(d.getDate() - recuo);
  return d.toLocaleDateString('en-CA');
}

function somaDias(iso, n){
  const d = new Date(iso + 'T12:00:00');
  d.setDate(d.getDate() + n);
  return d.toLocaleDateString('en-CA');
}

const diasSemana = () => [0,1,2,3,4,5].map(i => somaDias(SEG, i));  // seg..sáb

async function carregarPlano(){
  const [p, h] = await Promise.all([
    sb.rpc('fn_plano_semana', { p_inicio: SEG }),
    sb.rpc('fn_itens_com_historico', { p_ref: null })
  ]);
  if(p.error) throw p.error;
  if(h.error) throw h.error;
  PLANO = p.data || {};
  HIST  = h.data || {};
}

async function trocarAba(a){
  ABA = a;
  if(a === 'semana'){
    try{ await carregarPlano(); }
    catch(e){ toast(erroDe(e), true); }
  }
  render();
}

async function irSemana(n){
  SEG = somaDias(SEG, n * 7);
  try{ await carregarPlano(); render(); }
  catch(e){ toast(erroDe(e), true); }
}

/* Um prato repetido na mesma semana é exatamente o que ele quer evitar */
function repetidos(){
  const conta = {};
  diasSemana().forEach(d => (PLANO[d] || []).forEach(i => {
    // Fixo fora da conta: arroz todo dia é proposital, e sem isso a
    // semana inteira ficaria marcada como repetida.
    if(i.fixo) return;
    conta[i.id] = (conta[i.id] || 0) + 1;
  }));
  return new Set(Object.keys(conta).filter(k => conta[k] > 1));
}

function selo(dias){
  if(dias === null || dias === undefined)
    return '<span class="dias novo">nunca</span>';
  if(dias <= 6)  return `<span class="dias recente">há ${dias}d</span>`;
  if(dias <= 13) return `<span class="dias perto">há ${dias}d</span>`;
  return `<span class="dias longe">há ${dias}d</span>`;
}

function semanaHTML(){
  const rep = repetidos();
  const hj = hoje();
  const fim = somaDias(SEG, 5);
  const temRep = rep.size > 0;

  return `
    <div class="cartao">
      <h2>Planejamento da semana</h2>
      <div class="ajuda">Só para se orientar — não altera o cardápio do dia. No dia, monte o cardápio na aba "Hoje".</div>

      <div class="navsem">
        <button class="btn-2 seta" onclick="irSemana(-1)" title="Semana anterior">←</button>
        <strong class="periodo">${dbr(SEG).slice(0,5)} a ${dbr(fim).slice(0,5)}</strong>
        <button class="btn-2 seta" onclick="irSemana(1)" title="Próxima semana">→</button>
        <button class="btn-2 atual" onclick="SEG=segundaDe(hoje());irSemana(0)">Hoje</button>
        <span class="menufix">
          <button class="btn fixsem" onclick="menuFixos(event)">★ Fixos ▾</button>
          <div class="dropfix" id="dropFix">
            <button onclick="preencherFixos()">Preencher a semana</button>
            <button onclick="removerFixos()">Remover da semana</button>
            <hr>
            <button onclick="editarFixos()">Editar quais são fixos…</button>
          </div>
        </span>
      </div>

      ${temRep ? `<div class="repaviso">Há prato repetido nesta semana (marcado em vermelho).</div>` : ''}

      <div class="semana">
        ${diasSemana().map((d, i) => {
          const itens = PLANO[d] || [];
          return `<div class="pdia ${d === hj ? 'hoje' : ''}">
            <h4>${NOMES_DIA[i]} <span class="num">${dbr(d).slice(0,5)}</span>
              ${itens.length ? `<span class="totdia">${itens.length}</span>` : ''}</h4>
            <div class="acoes">
              <button class="btn-2" onclick="copiarDia('${d}')">Copiar de…</button>
              <button class="btn-2" onclick="limparDia('${d}')" ${itens.length?'':'disabled'}>Limpar</button>
            </div>
            ${CATS.map(c => {
              const meus = itens.filter(x => x.categoria === c.key);
              return `<div class="grupo">
                <div class="rot">
                  <span class="etq">${c.rot}${meus.length ? `<span class="cont ${c.tag}">${meus.length}</span>` : ''}</span>
                  <button onclick="escolher('${d}','${c.key}')" title="Adicionar">+</button>
                </div>
                ${meus.length
                  ? meus.map(x => `<div class="pill ${c.tag} ${rep.has(x.id)?'rep':''}">
                      <span title="${esc(x.nome)}${x.fixo?' (todo dia)':''}">${x.fixo?'★ ':''}${esc(x.nome)}</span>
                      <button onclick="tirarDoPlano('${d}','${x.id}')" title="Tirar">×</button>
                    </div>`).join('')
                  : '<div class="vaziog">—</div>'}
              </div>`;
            }).join('')}
          </div>`;
        }).join('')}
      </div>
    </div>
  `;
}

/* Escolher itens: ordenado por quem está há mais tempo sem entrar num
   plano. Ele escolhe de cima para baixo e para de repetir sozinho.
   Seleção múltipla: marca vários e adiciona de uma vez, porque montar
   um dia inteiro reabrindo a lista a cada item é o que cansa. */
let SEL = new Set();

function escolher(dia, cat){
  const c = CATS.find(x => x.key === cat);
  const jaTem = new Set((PLANO[dia] || []).map(x => x.id));
  const lista = (HIST[cat] || []);
  SEL = new Set();

  abrirModal(`
    <h3>${c.rot} — ${NOMES_DIA[diasSemana().indexOf(dia)]}, ${dbr(dia)}</h3>
    <div class="ajuda" style="margin-bottom:12px">Em cima, o que está há mais tempo sem entrar no plano. Marque quantos quiser.</div>
    <input id="bModal" placeholder="Buscar…" autocomplete="off"
           oninput="filtrarModal(this.value)" style="margin-bottom:10px">
    <div class="escolha" id="listaModal">
      ${lista.map(i => jaTem.has(i.id)
        ? `<div class="opt ja" data-nome="${esc(chave(i.nome))}">
             <span class="marca">✓</span>
             <span class="n">${esc(i.nome)}</span>
             <span class="dias longe">já está</span>
           </div>`
        : `<div class="opt" data-nome="${esc(chave(i.nome))}" data-id="${i.id}"
                onclick="marcar(this,'${i.id}')">
             <span class="marca"></span>
             <span class="n">${i.fixo?'★ ':''}${esc(i.nome)}</span>
             ${i.fixo ? '<span class="dias longe">todo dia</span>' : selo(i.dias)}
           </div>`).join('') || '<div class="vaziog">Nenhum item nesta categoria.</div>'}
    </div>
    <div class="rodape">
      <span class="contsel" id="contSel">Nenhum marcado</span>
      <button class="btn-2" onclick="fecharModal()">Cancelar</button>
      <button class="btn" id="btnAdd" onclick="adicionarMarcados('${dia}')" disabled>Adicionar</button>
    </div>
  `);
  setTimeout(()=>$('bModal')?.focus(), 60);
}

function marcar(el, id){
  if(SEL.has(id)){ SEL.delete(id); el.classList.remove('sel'); }
  else           { SEL.add(id);    el.classList.add('sel'); }

  const n = SEL.size;
  $('contSel').textContent = n === 0 ? 'Nenhum marcado'
                           : n === 1 ? '1 marcado' : `${n} marcados`;
  $('btnAdd').disabled = n === 0;
  $('btnAdd').textContent = n > 1 ? `Adicionar ${n}` : 'Adicionar';
}

function filtrarModal(v){
  const b = chave(v.trim());
  $('listaModal').querySelectorAll('.opt').forEach(el => {
    el.style.display = !b || el.dataset.nome.includes(b) ? '' : 'none';
  });
}

async function adicionarMarcados(dia){
  const ids = [...SEL];
  if(!ids.length) return;

  const btn = $('btnAdd');
  btn.disabled = true; btn.textContent = 'Adicionando…';

  // Um por vez: se algum falhar, os outros já entraram e a tela mostra
  // exatamente o que ficou de fora.
  const falhas = [];
  for(const id of ids){
    const { error } = await sb.rpc('fn_plano_marcar', { p_data: dia, p_item: id, p_incluir: true });
    if(error) falhas.push(id);
  }

  fecharModal();
  await carregarPlano(); render();

  if(falhas.length) toast(`${falhas.length} ${falhas.length===1?'item não entrou':'itens não entraram'}. Tente de novo.`, true);
  else toast(ids.length === 1 ? 'Item adicionado.' : `${ids.length} itens adicionados.`);
}

async function tirarDoPlano(dia, id){
  const { error } = await sb.rpc('fn_plano_marcar', { p_data: dia, p_item: id, p_incluir: false });
  if(error){ toast(erroDe(error), true); return; }
  await carregarPlano(); render();
}

function menuFixos(e){
  e.stopPropagation();
  $('dropFix').classList.toggle('on');
}
document.addEventListener('click', () => $('dropFix')?.classList.remove('on'));

/* Remove só os fixos da semana, preservando tudo que foi planejado à
   mão. Diferente do "Limpar", que apaga o dia inteiro. */
async function removerFixos(){
  const dias = diasSemana();
  const alvo = [];
  dias.forEach(d => (PLANO[d] || []).forEach(i => { if(i.fixo) alvo.push([d, i.id]); }));

  if(!alvo.length){ toast('Não há fixos na semana.'); return; }
  if(!confirm(`Tirar ${alvo.length} ${alvo.length===1?'item fixo':'itens fixos'} desta semana?\n\nO que você planejou à mão continua.`)) return;

  const falhas = [];
  for(const [d, id] of alvo){
    const { error } = await sb.rpc('fn_plano_marcar', { p_data: d, p_item: id, p_incluir: false });
    if(error) falhas.push(id);
  }
  await carregarPlano(); render();
  if(falhas.length) toast(`${falhas.length} não saíram. Tente de novo.`, true);
  else toast(`${alvo.length} ${alvo.length===1?'item removido':'itens removidos'}.`);
}

/* Um clique preenche os seis dias com o que sai todo dia. Depois ele
   edita à vontade — viram itens normais do plano. */
async function preencherFixos(){
  const fim = somaDias(SEG, 5);
  const { data, error } = await sb.rpc('fn_plano_preencher_fixos', { p_de: SEG, p_ate: fim });
  if(error){ toast(erroDe(error), true); return; }
  await carregarPlano(); render();
  toast(data ? `${data} ${data===1?'item adicionado':'itens adicionados'}.`
             : 'Os fixos já estavam na semana toda.');
}

async function limparDia(dia){
  if(!confirm(`Limpar o planejamento de ${dbr(dia)}?`)) return;
  const { error } = await sb.rpc('fn_plano_limpar', { p_data: dia });
  if(error){ toast(erroDe(error), true); return; }
  await carregarPlano(); render();
}

/* Semana parecida com a anterior é comum. Sem isso, redigitar tudo é o
   que faz o dono largar a ferramenta na segunda semana. */
function copiarDia(destino){
  const opcoes = [];
  for(let k = -7; k <= 5; k++){
    const d = somaDias(SEG, k);
    if(d === destino) continue;
    if((PLANO[d] || []).length) opcoes.push(d);
  }
  const anteriores = [];
  for(let k = 1; k <= 21; k++) anteriores.push(somaDias(destino, -k));

  abrirModal(`
    <h3>Copiar para ${dbr(destino)}</h3>
    <div class="ajuda" style="margin-bottom:12px">Os itens são somados ao que já existe no dia.</div>
    <div class="campo">
      <label>Copiar de qual dia</label>
      <input type="date" id="dCopia" value="${somaDias(destino,-7)}">
    </div>
    <div class="rodape">
      <button class="btn-2" onclick="fecharModal()">Cancelar</button>
      <button class="btn" onclick="fazerCopia('${destino}')">Copiar</button>
    </div>
  `);
}

async function fazerCopia(destino){
  const de = $('dCopia').value;
  if(!de) return;
  const { data, error } = await sb.rpc('fn_plano_copiar', { p_de: de, p_para: destino });
  if(error){ toast(erroDe(error), true); return; }
  fecharModal();
  await carregarPlano(); render();
  toast(data ? `${data} ${data===1?'item copiado':'itens copiados'}.` : 'Nada para copiar nesse dia.');
}

/* ================= RENDER ================= */
function render(){
  const abas = `
    <div class="abas">
      <button class="${ABA==='hoje'?'on':''}"   onclick="trocarAba('hoje')">Cardápio de hoje</button>
      <button class="${ABA==='semana'?'on':''}" onclick="trocarAba('semana')">Planejar a semana</button>
    </div>`;

  if(ABA === 'semana'){
    $('app').innerHTML = abas + semanaHTML();
    return;
  }

  $('app').innerHTML = abas + `
    <div class="cartao">
      <h2>Itens do cardápio</h2>
      <div class="ajuda">O interruptor define o que aparece no site hoje. Desligar não apaga o item — ele fica guardado para os próximos dias.</div>

      <div class="filtros">
        <span class="caixabusca">
          <input id="busca" placeholder="Buscar comida pelo nome…" value="${esc(BUSCA)}"
                 oninput="filtrarBusca(this.value)" autocomplete="off"
                 onkeydown="if(event.key==='Escape'){event.preventDefault();limparBusca()}">
          ${BUSCA ? `<button class="limpar" onclick="limparBusca()" title="Limpar (Esc)">×</button>` : ''}
        </span>
        <label class="chkbox ${SO_ATIVOS?'on':''}">
          <input type="checkbox" ${SO_ATIVOS?'checked':''} onchange="alternarSoAtivos(this.checked)">
          Só os do cardápio de hoje
        </label>
        <label class="chkbox estrela ${SO_FIXOS?'on':''}">
          <input type="checkbox" ${SO_FIXOS?'checked':''} onchange="alternarSoFixos(this.checked)">
          ★ Só os de todo dia
        </label>
        <span class="resumo" id="resumoFiltro"></span>
      </div>

      ${SO_FIXOS ? `<div class="aviso info" style="margin-bottom:14px">
        Mostrando só os itens que entram todo dia no planejamento. Use a
        estrela para tirar ou incluir. Isso não liga nem desliga nada no
        cardápio de hoje.</div>` : ''}

      <div class="colunas">
        ${CATS.map(c => colunaHTML(c)).join('')}
      </div>
    </div>

    <div class="cartao">
      <h2>O que o site vai mostrar</h2>
      <div class="ajuda">Exatamente o que o cliente vê na página e nas opções da marmita personalizada.</div>
      <div class="preview">
        ${CATS.map(c => {
          const its = ativos(c.key);
          return `<div class="pbox">
            <h4>${c.rot}</h4>
            ${its.length
              ? its.map(i => `<span class="tag ${c.tag}">${esc(i.nome)}</span>`).join('')
              : '<span class="pvazio">Nenhum item hoje</span>'}
          </div>`;
        }).join('')}
      </div>
    </div>

    <div class="cartao">
      <h2>Mensagem para o grupo</h2>
      <div class="ajuda">Montada a partir dos itens ligados acima. Dá para editar antes de copiar — a saudação do fim muda sozinha conforme o dia da semana.</div>
      <textarea id="txtWhats" spellcheck="false" oninput="ZAP_MEXIDO=true"></textarea>
      <div class="zapbar">
        <span class="esq" id="zapInfo"></span>
        <button class="btn-2" onclick="regerarZap()">Refazer texto</button>
        <button class="btn" onclick="copiarZap()">Copiar</button>
        <a class="btn-zap" id="linkZap" target="_blank" rel="noopener">Abrir no WhatsApp</a>
      </div>
    </div>

    <div class="cartao">
      <h2>Dias fechados</h2>
      <div class="ajuda">Nessas datas o site recusa pedidos e mostra "Fechado agora".</div>
      <div style="display:flex;gap:8px;max-width:380px;flex-wrap:wrap">
        <input type="date" id="novoDia" min="${hoje()}" style="flex:1;min-width:150px">
        <button class="btn" onclick="addDia()" style="flex:none">Marcar</button>
      </div>
      <div class="fechados">
        ${FECHADOS.length
          ? FECHADOS.map(d => `<span class="dia">${dbr(d.data)}
              <button onclick="delDia('${d.data}')" title="Remover">×</button></span>`).join('')
          : '<span class="pvazio" style="font-size:13.5px">Nenhum dia marcado.</span>'}
      </div>
    </div>
  `;

  const total = CATS.reduce((n,c) => n + daCat(c.key).length, 0);
  const vis   = CATS.reduce((n,c) => n + filtrada(c.key).length, 0);
  document.body.classList.toggle('filtrado', filtroLigado());
  const el = $('resumoFiltro');
  if(el) el.textContent = filtroLigado()
    ? `mostrando ${vis} de ${total} · arrastar desativado`
    : `${total} ${total===1?'item':'itens'} no total`;

  pintarZap();
}

/* ===================================================================
   MENSAGEM DO WHATSAPP
   Mesmo formato que o grupo já recebe: sem títulos de categoria, uma
   linha em branco separando os blocos, e a saudação do dia no fim.
   =================================================================== */
const DIAS_SEM = ['DOMINGO','SEGUNDA-FEIRA','TERÇA-FEIRA','QUARTA-FEIRA',
                  'QUINTA-FEIRA','SEXTA-FEIRA','SÁBADO'];
let ZAP_MEXIDO = false;   // se o dono editou à mão, não sobrescreve

function diaSemanaSP(){
  // Meio-dia evita o dia virar por causa de fuso
  return new Date(hoje() + 'T12:00:00').getDay();
}

function textoZap(){
  const d = diaSemanaSP();
  // Sábado e domingo são masculinos: "BOM", não "BOA"
  const artigo = (d === 0 || d === 6) ? 'BOM' : 'BOA';

  // Categoria vazia não vira linha em branco sobrando
  const blocos = CATS
    .map(c => ativos(c.key).map(i => i.nome).join('\n'))
    .filter(b => b.length);

  return [
    'Bom dia!!!',
    '',
    'Segue o cardápio de hoje👇🏼',
    '',
    blocos.join('\n\n'),
    '',
    'Pedido de marmitas acesse: https://www.restaurantedomario.com.br/',
    '',
    `*${artigo} ${DIAS_SEM[d]} A TODOS!!!*`
  ].join('\n');
}

function pintarZap(){
  const ta = $('txtWhats');
  if(!ta) return;
  if(!ZAP_MEXIDO) ta.value = textoZap();
  const total = CATS.reduce((n,c) => n + ativos(c.key).length, 0);
  $('zapInfo').textContent = `${total} ${total === 1 ? 'item' : 'itens'} no cardápio de hoje`
    + (ZAP_MEXIDO ? ' · texto editado à mão' : '');
  $('linkZap').href = 'https://wa.me/?text=' + encodeURIComponent(ta.value);
}

function regerarZap(){
  ZAP_MEXIDO = false;
  pintarZap();
  toast('Texto refeito a partir do cardápio.');
}

async function copiarZap(){
  const ta = $('txtWhats');
  try{
    await navigator.clipboard.writeText(ta.value);
    toast('Cardápio copiado. É só colar no grupo.');
  }catch(e){
    // clipboard exige contexto seguro; se falhar, seleciona para copiar na mão
    ta.focus(); ta.select(); ta.setSelectionRange(0, 999999);
    try{
      document.execCommand('copy');
      toast('Cardápio copiado. É só colar no grupo.');
    }catch(_){
      toast('Não consegui copiar. O texto está selecionado — use Ctrl+C.', true);
    }
  }
}

function colunaHTML(c){
  const todos = daCat(c.key);
  const its = filtrada(c.key);
  const ligados = todos.filter(i => i.ativo).length;
  const ehCarne = c.key === 'carnes';
  const tresPrimeiras = ativos('carnes').slice(0,3).map(i => i.id);

  return `<div class="cat">
    <h3>${c.rot} <span class="conta">${ligados}/${todos.length}</span></h3>
    <div class="lista" data-cat="${c.key}">
      ${its.length === 0
        ? `<div class="semresultado">${todos.length ? 'Nenhum item com esse filtro.' : 'Nenhum item ainda.'}</div>`
        : ''}
      ${its.map(i => {
        const destaque = ehCarne && tresPrimeiras.includes(i.id);
        return `<div class="item ${i.ativo?'':'off'} ${destaque?'marca3':''}" data-id="${i.id}">
          <span class="pega" title="Arraste para reordenar">⠿</span>
          <button class="chave ${i.ativo?'on':''}" onclick="alternar('${i.id}')"
                  title="${i.ativo?'No cardápio de hoje':'Fora do cardápio'}"></button>
          <span class="nome" title="Clique para renomear">${esc(i.nome)}</span>
          <button class="fix ${i.fixo?'on':''}" onclick="alternarFixo('${i.id}')"
                  title="${i.fixo?'Entra todo dia no planejamento':'Marcar como item de todo dia'}">${i.fixo?'★':'☆'}</button>
          <button class="x" onclick="remover('${i.id}')" title="Excluir">×</button>
        </div>`;
      }).join('')}
    </div>
    <div class="novo">
      <input id="novo_${c.key}" placeholder="Adicionar item"
             onkeydown="if(event.key==='Enter')adicionar('${c.key}')">
      <button class="btn" onclick="adicionar('${c.key}')">+</button>
    </div>
    ${ehCarne ? `<div class="aviso3">As <strong>3 primeiras carnes ligadas</strong> (barra laranja) entram na descrição da marmita padrão. A ordem muda o que vai na comanda.</div>` : ''}
  </div>`;
}

/* ===================================================================
   ARRASTAR PARA REORDENAR
   Pointer events cobrem mouse e toque com o mesmo código. No mouse dá
   para pegar a linha inteira; no toque só pela pega, senão o dedo não
   consegue mais rolar a página.
   =================================================================== */
let ARR = null;

document.addEventListener('pointerdown', e => {
  if(e.button !== undefined && e.button !== 0) return;
  const item = e.target.closest('.item');
  if(!item) return;
  if(e.target.closest('button, input')) return;              // toggle, ×, edição
  const naPega = !!e.target.closest('.pega');
  if(e.pointerType !== 'mouse' && !naPega) return;           // toque: só pela pega

  const lista = item.closest('.lista');
  if(!lista) return;

  /* Com filtro ligado a lista na tela é um recorte. Reordenar um
     recorte e gravar só os ids visíveis apagaria a posição de tudo que
     está escondido. Em vez de arriscar, o arrasto fica desativado e a
     tela diz o porquê. */
  if(filtroLigado()){
    toast('Limpe o filtro para reordenar.', true);
    return;
  }

  const r = item.getBoundingClientRect();
  ARR = {
    item, lista,
    dx: e.clientX - r.left,
    dy: e.clientY - r.top,
    larg: r.width,
    x0: e.clientX, y0: e.clientY,
    ativo: false,
    ptr: e.pointerId
  };
});

document.addEventListener('pointermove', e => {
  if(!ARR || e.pointerId !== ARR.ptr) return;

  // Só vira arrasto depois de 5px: um clique trêmulo não conta
  if(!ARR.ativo){
    if(Math.hypot(e.clientX - ARR.x0, e.clientY - ARR.y0) < 5) return;
    ARR.ativo = true;
    document.body.classList.add('arrastando');

    ARR.clone = ARR.item.cloneNode(true);
    ARR.clone.classList.add('voando');
    ARR.clone.classList.remove('fantasma');
    ARR.clone.style.width = ARR.larg + 'px';
    document.body.appendChild(ARR.clone);
    ARR.item.classList.add('fantasma');
  }

  e.preventDefault();
  ARR.clone.style.left = (e.clientX - ARR.dx) + 'px';
  ARR.clone.style.top  = (e.clientY - ARR.dy) + 'px';

  // Reordena ao vivo: o espaço abre antes de soltar
  const alvo = [...ARR.lista.querySelectorAll('.item:not(.fantasma)')]
    .find(el => {
      const r = el.getBoundingClientRect();
      return e.clientY < r.top + r.height / 2;
    });
  if(alvo) ARR.lista.insertBefore(ARR.item, alvo);
  else     ARR.lista.appendChild(ARR.item);
}, { passive:false });

document.addEventListener('pointerup', async e => {
  if(!ARR || e.pointerId !== ARR.ptr) return;
  const a = ARR; ARR = null;
  if(!a.ativo) return;

  a.clone.remove();
  a.item.classList.remove('fantasma');
  document.body.classList.remove('arrastando');

  const ids = [...a.lista.querySelectorAll('.item')].map(el => el.dataset.id);
  const cat = a.lista.dataset.cat;

  // Estado local primeiro, para a marca laranja das carnes acompanhar na hora
  ids.forEach((id, i) => {
    const it = ITENS.find(x => x.id === id);
    if(it) it.ordem = i + 1;
  });
  ITENS.sort((x,y) => x.categoria.localeCompare(y.categoria)
                   || (x.ordem||0) - (y.ordem||0));
  render();

  const { error } = await sb.rpc('fn_reordenar_cardapio', { p_ids: ids });
  if(error){ toast(erroDe(error), true); carregar(); return; }
  if(cat === 'carnes') toast('Ordem salva. Confira as 3 primeiras carnes.');
});

document.addEventListener('pointercancel', () => {
  if(ARR?.ativo){
    ARR.clone?.remove();
    ARR.item.classList.remove('fantasma');
    document.body.classList.remove('arrastando');
    carregar();
  }
  ARR = null;
});

/* Renomear clicando no nome */
document.addEventListener('click', e => {
  const nome = e.target.closest('.nome');
  if(!nome) return;
  const item = nome.closest('.item');
  const id = item.dataset.id;
  const it = ITENS.find(x => x.id === id);
  if(!it) return;

  const inp = document.createElement('input');
  inp.className = 'edita';
  inp.value = it.nome;
  nome.replaceWith(inp);
  inp.focus(); inp.select();

  let fechado = false;
  const encerrar = async salvar => {
    if(fechado) return; fechado = true;
    const novo = inp.value.trim();
    if(!salvar || !novo || novo === it.nome){ render(); return; }
    const { error } = await sb.from('cardapio_itens')
      .update({ nome: novo }).eq('id', id);
    if(error){ toast(erroDe(error), true); render(); return; }
    it.nome = novo; render();
    toast('Item renomeado.');
  };

  inp.onblur = () => encerrar(true);
  inp.onkeydown = ev => {
    if(ev.key === 'Enter'){ ev.preventDefault(); encerrar(true); }
    if(ev.key === 'Escape'){ ev.preventDefault(); encerrar(false); }
  };
});

/* ================= MODAL ================= */
/* Clique fora não fecha: perder a escolha por um toque errado custa
   mais que o atalho economiza. */
function abrirModal(html){
  fecharModal();
  const d = document.createElement('div');
  d.className = 'modal';
  d.onclick = e => {
    if(e.target !== d) return;
    const j = d.querySelector('.janela');
    if(!j || j.classList.contains('chacoalha')) return;
    j.classList.add('chacoalha');
    setTimeout(()=>j.classList.remove('chacoalha'), 320);
  };
  d.innerHTML = `<div class="janela">${html}</div>`;
  document.body.appendChild(d);
}
function fecharModal(){ document.querySelector('.modal')?.remove(); }
document.addEventListener('keydown', e => { if(e.key === 'Escape') fecharModal(); });

/* ================= AÇÕES ================= */
async function alternar(id){
  if(OCUPADO) return; OCUPADO = true;
  const it = ITENS.find(i => i.id === id);
  const novo = !it.ativo;
  it.ativo = novo; render();                     // resposta imediata
  const { error } = await sb.from('cardapio_itens').update({ ativo: novo }).eq('id', id);
  OCUPADO = false;
  if(error){ it.ativo = !novo; render(); toast(erroDe(error), true); }
}

async function adicionar(cat){
  const inp = $('novo_' + cat);
  const nome = inp.value.trim();
  if(!nome) return;
  const maxOrdem = Math.max(0, ...daCat(cat).map(i => i.ordem || 0));
  const { error } = await sb.from('cardapio_itens')
    .insert({ categoria: cat, nome, ordem: maxOrdem + 1, ativo: true });
  if(error){ toast(erroDe(error), true); return; }
  inp.value = '';
  await carregar();
  $('novo_' + cat).focus();
  toast('Item adicionado.');
}

async function remover(id){
  const it = ITENS.find(i => i.id === id);
  if(!confirm(`Excluir "${it.nome}" de vez?\n\nSe for só para tirar do cardápio de hoje, use o interruptor — assim ele continua guardado.`)) return;
  const { error } = await sb.from('cardapio_itens').delete().eq('id', id);
  if(error){ toast(erroDe(error), true); return; }
  await carregar();
  toast('Item excluído.');
}

async function addDia(){
  const d = $('novoDia').value;
  if(!d) return;
  const { error } = await sb.from('dias_fechados').insert({ data: d });
  if(error && error.code !== '23505'){ toast(erroDe(error), true); return; }
  await carregar();
  toast('Dia marcado como fechado.');
}

async function delDia(d){
  const { error } = await sb.from('dias_fechados').delete().eq('data', d);
  if(error){ toast(erroDe(error), true); return; }
  await carregar();
  toast('Dia reaberto.');
}

/* ================= INÍCIO ================= */
(async () => {
  const { data } = await sb.auth.getSession();
  if(data?.session){
    $('login').style.display = 'none';
    carregar();
  } else {
    setTimeout(()=>$('email').focus(), 100);
  }
})();
</script>
